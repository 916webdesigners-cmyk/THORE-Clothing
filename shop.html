<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0b"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23111%27/%3E%3Cpath d=%27M18 3 8 18h7l-2 11 11-16h-7z%27 fill=%27%23e6dfd1%27/%3E%3C/svg%3E"><title>Shop — THORE</title></head>
<body data-page="shop">
<main class="wrap page-top"><div class="page-h"><p class="eyebrow">THORE</p><h1 class="display" id="title">Shop all</h1></div>
  <div class="toolbar"><div class="filters" id="filters"></div><select class="sort" id="sort" aria-label="Sort"><option value="feat">Featured</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option></select></div>
  <div class="grid" id="grid"></div></main>
<script src="js/products.js"></script><script src="js/garments.js"></script><script src="js/app.js"></script>
<script>
(function(){
  const cats=[['all','All'],['hoodies','Hoodies'],['sweatpants','Sweatpants'],['tees','Tees']];
  let cat=new URLSearchParams(location.search).get('c')||'all', sort='feat';
  const f=document.getElementById('filters');
  function render(){
    f.innerHTML=cats.map(c=>'<button class="chip '+(c[0]===cat?'on':'')+'" data-c="'+c[0]+'">'+c[1]+'</button>').join('');
    f.querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;history.replaceState(0,'',cat==='all'?'shop.html':'shop.html?c='+cat);render()});
    let list=THORE_PRODUCTS.filter(p=>cat==='all'||p.category===cat);
    if(sort==='lo')list=[...list].sort((a,b)=>a.price-b.price);if(sort==='hi')list=[...list].sort((a,b)=>b.price-a.price);
    document.getElementById('title').textContent=cat==='all'?'Shop all':cats.find(c=>c[0]===cat)[1];
    document.getElementById('grid').innerHTML=list.map(p=>THORE.card(p)).join('');THORE.observe();
  }
  document.getElementById('sort').onchange=e=>{sort=e.target.value;render()};render();
})();
</script></body></html>
